name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VolSkip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolSkip
          path: VolSkip.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: VolSkip (latest build)
          make_latest: true
          files: VolSkip.apk
