name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VolSkip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolSkip
          path: VolSkip.apk
      - name: Rolling pre-release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VolSkip (latest build)
          prerelease: true
          files: VolSkip.apk
      - name: Versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VolSkip ${{ github.ref_name }}
          generate_release_notes: true
          files: VolSkip.apk
