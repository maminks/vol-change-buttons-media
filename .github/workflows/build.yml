name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VolSkip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolSkip
          path: VolSkip.apk
      - name: Rolling pre-release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VolSkip (latest build)
          prerelease: true
          files: VolSkip.apk
      - name: Read version
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Versioned release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: VolSkip v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: VolSkip.apk
